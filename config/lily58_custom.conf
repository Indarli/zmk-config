# Settings shared by both halves (left and right).

# Encoder on the left half
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# No OLED on this build
CONFIG_ZMK_DISPLAY=n

# Deep sleep after 15 min idle — wakes on keypress
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio enabled: hold ESC (tap-dance) to unlock runtime keymap editing.
# Set to n together with removing &td_studio from the keymap to lock the compiled keymap.
CONFIG_ZMK_STUDIO=y

# No RGB underglow / LEDs on this build
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_LED=n
CONFIG_LED_STRIP=n
CONFIG_LED_GPIO=n
